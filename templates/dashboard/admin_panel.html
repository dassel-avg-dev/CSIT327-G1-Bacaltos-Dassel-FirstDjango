{% extends "base.html" %}

{% block content %}
<h1>Hello, {{ user.username }}</h1>
<ul>
	<li>Role: {{ user.get_role_display }}</li>
	<li>Course: {{ user.course|default:"Not set" }}</li>
	<li>Members: {{ member_count }}</li>
	<li>Last login: {{ user.last_login|date:"M d, Y" }}</li>
</ul>
{% endblock %}
