{% extends "base.html" %}

{% block content %}
<h1 class="h3 mb-4">Log in</h1>
<form method="post" class="col-12 col-lg-6">
  {% csrf_token %}
  {% include "registration/_form_fields.html" %}
  <button type="submit" class="btn btn-primary">Log in</button>
</form>
<p class="mt-3">No account? <a href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
